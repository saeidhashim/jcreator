<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JCreator for Windows - Download - Softonic</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--green:#00a656;--border:#e6e8eb}
body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:#fff;color:#1d1d1f;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit}

/* Page wrapper to center image */
.page-wrap{max-width:none;width:100%;margin:0;background:#fff;position:relative}
.image-container{position:relative;width:100%;line-height:0}
.bg-image{display:block;width:100%;height:auto;user-select:none}

/* HEADER OVERLAY - covers original header in screenshot */
.header-overlay{
  position:absolute;top:0;left:0;right:0;
  height:4.95vw;
  min-height:62px;
  max-height:92px;
  background:#fff;
  border-bottom:1px solid #e6e8eb;
  display:flex;align-items:center;justify-content:space-between;
  gap:12px;
  padding:0 18px 0 14px;
  z-index:40;
  line-height:1.5;
}
.header-left{display:flex;align-items:center;gap:16px;flex-shrink:0}
.hamburger{width:34px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:8px;cursor:pointer}
.hamburger:hover{background:#f3f4f6}
.hamburger span,.hamburger span:before,.hamburger span:after{content:'';display:block;width:18px;height:2px;background:#111;border-radius:2px;position:relative}
.hamburger span:before{position:absolute;top:-6px}
.hamburger span:after{position:absolute;top:6px}
.logo{display:flex;align-items:center;gap:9px;cursor:pointer}
.logo-mark{width:34px;height:34px;display:flex;align-items:center;justify-content:center}
.logo-mark svg{width:34px;height:34px}
.logo-text{font-size:23px;font-weight:800;letter-spacing:-.02em;color:#2b2b2b}
.header-right{display:flex;align-items:center;gap:8px;flex:1;justify-content:flex-end;min-width:0}
.nav{display:flex;align-items:center;gap:1px;flex:1;justify-content:flex-end;min-width:0;overflow:visible}
.nav-item{position:relative;display:flex;align-items:center;gap:6px;padding:8px 10px;border-radius:10px;cursor:pointer;white-space:nowrap;font-size:13.5px;font-weight:500;color:#2d2d2d;transition:.15s;flex-shrink:0}
.nav-item:hover{background:#f3f4f6;color:#111}
.nav-item svg{width:17px;height:17px;opacity:.92;flex-shrink:0}
.search-btn,.profile-btn{width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:50%;cursor:pointer;flex-shrink:0}
.search-btn:hover,.profile-btn:hover{background:#f3f4f6}
.profile-btn{border-left:1px solid #e6e8eb;border-radius:0;padding-left:14px;margin-left:4px;width:auto}

/* POPUPS */

.nav-item::after{content:'';position:absolute;left:0;right:0;top:100%;height:14px;display:none}
.nav-item:hover::after{display:block}

.popup{position:absolute;top:calc(100% + 12px);left:50%;transform:translateX(-50%);width:760px;max-width:92vw;background:#fff;border:1px solid #e5e7eb;border-radius:16px;box-shadow:0 20px 50px rgba(0,0,0,.18),0 4px 14px rgba(0,0,0,.10);display:none;z-index:80;overflow:visible;line-height:1.5;text-align:left}
.popup::before{content:'';position:absolute;top:-14px;left:0;right:0;height:14px;background:transparent}
.popup-inner{position:relative;background:#fff;border-radius:16px;overflow:hidden}
.popup:after{content:'';position:absolute;top:-7px;left:50%;transform:translateX(-50%) rotate(45deg);width:14px;height:14px;background:#fff;border-left:1px solid #e5e7eb;border-top:1px solid #e5e7eb}
.nav-item:hover .popup,.nav-item:focus-within .popup,.popup:hover{display:block;animation:popIn .16s ease}
@keyframes popIn{from{opacity:0;transform:translateX(-50%) translateY(6px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.popup-header{padding:16px 18px 14px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;background:linear-gradient(180deg,#f9fafb,#fff);border-bottom:1px solid #f0f0f0}
.ex-badge{display:inline-flex;align-items:center;gap:6px;background:#111;color:#fff;font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;padding:4px 9px;border-radius:999px}
.ex-badge span{opacity:.7;font-weight:500}
.popup-title{font-size:15px;font-weight:800;color:#111;margin-top:8px;line-height:1.25}
.popup-sub{font-size:12.5px;color:#6b7280;margin-top:4px;line-height:1.45}
.popup-actions{display:flex;gap:8px;flex-shrink:0;margin-top:2px}
.icon-btn{width:34px;height:34px;border:1px solid #e5e7eb;background:#fff;border-radius:9px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.icon-btn:hover{background:#f3f4f6}
.tab-bar{display:flex;gap:6px;padding:10px 12px;background:#fff;border-bottom:1px solid #f0f0f0;flex-wrap:wrap}
.tab-chip{padding:7px 12px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer;border:1px solid #e5e7eb;background:#fff;color:#374151;display:inline-flex;align-items:center;gap:7px;transition:.15s}
.tab-chip.active{background:#111;color:#fff;border-color:#111}
.tab-chip small{font-size:11px;opacity:.7;font-weight:500}
.copy-all{margin-left:auto;display:inline-flex;align-items:center;gap:6px;padding:7px 12px;background:#00a656;color:#fff;border:none;border-radius:999px;font-size:12.5px;font-weight:700;cursor:pointer}
.copy-all:hover{background:#00914a}
.panel{display:none;padding:14px}
.panel.active{display:block}
.code-wrap{position:relative;background:#0f172a;border-radius:12px;overflow:hidden;border:1px solid #1e293b}
.code-top{height:36px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;background:#0b1224;border-bottom:1px solid #1e293b}
.code-label{font-size:12px;font-weight:600;color:#94a3b8;letter-spacing:.4px;display:flex;align-items:center;gap:8px}
.code-label i{width:8px;height:8px;background:#22c55e;border-radius:50%;display:inline-block;box-shadow:0 0 0 4px rgba(34,197,94,.15)}
.copy-mini{padding:6px 10px;background:#1e293b;color:#e2e8f0;border:1px solid #334155;border-radius:8px;font-size:11px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px}
.copy-mini:hover{background:#334155}
.code-block{margin:0;padding:14px 16px;overflow:auto;max-height:340px;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;font-size:12.7px;line-height:1.62;color:#e2e8f0;white-space:pre;tab-size:2}
.code-block::-webkit-scrollbar{height:6px;width:6px}
.code-block::-webkit-scrollbar-thumb{background:#334155;border-radius:4px}
.algorithm{counter-reset:step;background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:14px 16px}
.algorithm ol{margin:0;padding-left:18px}
.algorithm li{font-size:13px;color:#1f2937;line-height:1.58;margin-bottom:7px;padding-left:4px}
.algorithm li::marker{font-weight:700;color:#00a656}
.result-box{background:#f9fafb;border:1px solid #e5e7eb;border-radius:12px;padding:0;overflow:hidden}
.result-head{padding:10px 14px;border-bottom:1px solid #e5e7eb;background:#fff;display:flex;align-items:center;justify-content:space-between}
.result-head b{font-size:13px}
.result-pre{margin:0;padding:14px 16px;font-family:ui-monospace,monospace;font-size:12.7px;line-height:1.60;color:#111;background:#f9fafb;white-space:pre-wrap;word-break:break-word}
.hint{font-size:11.5px;color:#6b7280;padding:10px 14px;background:#fffbe6;border-top:1px dashed #e8d27a;display:flex;gap:8px;align-items:center}
.hint strong{color:#111}

/* Fix for rightmost popups to stay in viewport */
.nav-item:nth-last-child(-n+3) .popup{left:auto;right:0;transform:none}
.nav-item:nth-last-child(-n+3) .popup:after{left:auto;right:28px;transform:rotate(45deg)}

.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:#111;color:#fff;padding:10px 16px;border-radius:999px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:200;display:flex;align-items:center;gap:8px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* Responsive */
@media(max-width:1280px){
  .nav{overflow:auto;scrollbar-width:none;max-width:58vw}
  .nav::-webkit-scrollbar{display:none}
}
@media(max-width:900px){
  .header-overlay{height:64px;padding:0 10px}
  .nav{max-width:none;gap:1px}
  .nav-item{padding:7px 8px;font-size:13px}
  .logo-text{font-size:20px}
  .popup{position:fixed;top:auto;bottom:0;left:0;right:0;transform:none;width:100%;max-width:100%;border-radius:18px 18px 0 0;max-height:82vh;overflow:auto}
  .popup:after{display:none}
  .nav-item .popup{left:0;right:0;transform:none}
  .nav-item:nth-last-child(-n+3) .popup{left:0;right:0;transform:none}
  .tab-bar{position:sticky;top:0;z-index:2}
  .code-block{max-height:260px}
}
@media(max-width:640px){
  .header-overlay{height:58px}
  .hamburger{width:30px;height:30px}
  .logo-mark{width:28px;height:28px}
  .search-btn,.profile-btn{width:34px;height:34px}
}
.note{max-width:1280px;margin:14px auto 30px;padding:12px 16px;background:#fffbe6;border:1px solid #f7e39a;border-radius:10px;font-size:13px;color:#7a6400;display:flex;gap:10px;align-items:center}
.note strong{color:#111}
</style>
</head>

  aim:'To write a Java application to extract a portion of a character string and print the extracted string.',

{
    public static void main(String args[])
    {
        Scanner sc = new Scanner(System.in);

  aim:'To write a Java program to implement the concept of multiple inheritance using interfaces.',
  algo:['Start the program.','Declare an interface Father with the abstract method fatherQuality().','Declare an interface Mother with the abstract method motherQuality().','Create a class Child that implements both Father and Mother and defines all their methods. Also add its own method childQuality().','In the main() method of the class MultipleInheritance, create an object of the class Child.','Call fatherQuality(), motherQuality() and childQuality() using the object.','Display the output and stop the program.'],
  program:`import java.util.*;

interface Father {
    void fatherQuality();
}

interface Mother {
    void motherQuality();
}

class Child implements Father, Mother {
    public void fatherQuality() {
        System.out.println("Child inherits qualities from Father.");
    }
    public void motherQuality() {
        System.out.println("Child inherits qualities from Mother.");
    }
    public void childQuality() {
        System.out.println("Child has its own qualities.");
    }
}

    }
}`,

{
  ex:'03',
  title:'USER-DEFINED EXCEPTION (PAYOUT-OF-BOUNDS)',
  aim:'To write a Java program to create an exception called payout-of-bounds and throw the exception.',
  algo:['Start the program.','Create a user-defined exception class payout_of_bounds by extending the Exception class.','Define a method checkpay(pay, paylimit) that declares throws payout_of_bounds.','Inside checkpay(), if pay is greater than paylimit, throw the exception using throw new payout_of_bounds(pay); otherwise print "Payout approved".','In main(), read the pay limit and the pay from the user.','Call checkpay() inside a try block.','Handle the exception in the catch block and display the exception message.','Stop the program.'],
  program:`import java.util.Scanner;

class payout_of_bounds extends Exception {
    public payout_of_bounds(int pay) {
        super();
    }
}

public class PayoutOutOfBounds
{
    static void checkpay(int pay, int paylimit) throws payout_of_bounds
    {
        if (pay > paylimit)
            throw new payout_of_bounds(pay);
        else
            System.out.println("Payout approved");
    }

    public static void main(String args[])
    {
        try
        {
            Scanner in = new Scanner(System.in);
            System.out.print("Enter Pay Limit: ");
            int paylimit = in.nextInt();
            System.out.print("Enter Pay: ");
            int pay = in.nextInt();
            checkpay(pay, paylimit);
        }
        catch (payout_of_bounds pob)
        {
            System.out.println("Caught the Exception");
            System.out.println("Exception occurred: " + pob);
        }
    }
}`,

Run 2 (pay exceeds the limit - exception thrown)

Enter Pay: 7500

{
  ex:'04',
  title:'MULTITHREADING WITH PRIORITIES',
  aim:'To write a Java program to implement the concept of multithreading with the use of any three multiplication tables and assign three different priorities to them.',
  algo:['Start the program.','Create a class TableThread that extends the Thread class and stores a number.','Override the run() method to print the multiplication table (1 to 10) of that number, pausing 500 ms after each line using Thread.sleep(500).','In main(), create three thread objects for the tables of 2, 5 and 10.','Set the thread names as Thread-1, Thread-2 and Thread-3.','Assign priorities: MIN_PRIORITY (1) to Thread-1, NORM_PRIORITY (5) to Thread-2 and MAX_PRIORITY (10) to Thread-3.','Display the priority of each thread using getPriority().','Start all three threads and stop the program.'],
  program:`class TableThread extends Thread {
    int number;
    TableThread(int number) {
        this.number = number;
    }
    public void run() {
        System.out.println("\\nMultiplication Table of " + number);
        for (int i = 1; i <= 10; i++) {
            System.out.println(
                Thread.currentThread().getName() +
                " : " + number + " x " + i + " = " + (number * i)
            );
            try {
                Thread.sleep(500);
            } catch (InterruptedException e) {
                System.out.println(e);
            }
        }
    }

  program:`import java.awt.*;
import java.awt.event.*;

public class MouseShapes extends Frame implements MouseListener {
    int x = 0, y = 0;
    int shape = 0;

    MouseShapes() {
        setTitle("Draw Shapes on Mouse Click");
        setSize(600, 500);
        addMouseListener(this);
        addWindowListener(new WindowAdapter() {
            public void windowClosing(WindowEvent we) {
                System.exit(0);
            }
        });
        setVisible(true);
    }

    public void paint(Graphics g) {
        switch(shape) {
            case 1:
                g.drawOval(x, y, 60, 60);
                break;
            case 2:
                g.drawRect(x, y, 60, 60);
                break;
            case 3:
                g.drawOval(x, y, 100, 60);
                break;
            case 4:
                g.drawRect(x, y, 100, 60);
                break;
        }
    }

    public void mouseClicked(MouseEvent me) {
        x = me.getX();
        y = me.getY();
        shape++;
        if(shape > 4)
            shape = 1;
        repaint();
    }

function createNav(){
  const nav=document.getElementById('nav');
  nav.innerHTML='';
  navConfig.forEach((item,i)=>{
    const prog=programs[i];
    const el=document.createElement('div');
    el.className='nav-item';
    el.tabIndex=0;
    el.innerHTML=`${item.icon}<span>${item.label}</span>
      <div class="popup" role="dialog" aria-label="${prog.title}">
        <div class="popup-inner">
          <div class="popup-header">
            <div class="popup-head-left">
              <div class="ex-badge">EX . ${prog.ex} <span>// JAVA LAB 2026-27</span></div>
              <div class="popup-title">${prog.title}</div>
              <div class="popup-sub">${prog.aim}</div>
            </div>
            <div class="popup-actions">
              <button class="icon-btn" title="Copy program" data-copy-all="${i}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="1.8"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M15 9 V7 a2 2 0 0 0-2-2 H5 a2 2 0 0 0-2 2 v8 a2 2 0 0 0 2 2 h2"/></svg></button>
            </div>
          </div>
          <div class="tab-bar" data-tabs="${i}">
            <button class="tab-chip active" data-tab="program"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M14 2 H7 a2 2 0 0 0-2 2 v16 a2 2 0 0 0 2 2 h10 a2 2 0 0 0 2-2 V8 Z"/><path d="M14 2 v6 h6"/><path d="M10 13 l-2 2 2 2"/><path d="M14 13 l2 2 -2 2"/></svg> Program</button>
            <button class="tab-chip" data-tab="algorithm"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M8 6 h8"/><path d="M8 10 h8"/><path d="M8 14 h5"/><circle cx="5" cy="6" r="1" fill="currentColor"/><circle cx="5" cy="10" r="1"/><circle cx="5" cy="14" r="1"/></svg> Algorithm</button>
            <button class="tab-chip" data-tab="output"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9 l3 3 -3 3"/><path d="M13 15 h5"/></svg> Output</button>
            <button class="copy-all" data-copy-current="${i}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.9"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M15 9 V7 a2 2 0 0 0-2-2 H5 a2 2 0 0 0-2 2 v8 a2 2 0 0 0 2 2 h2"/></svg> Copy</button>
          </div>
          <div class="panel active" data-panel="program">
            <div class="code-wrap">
              <div class="code-top"><span class="code-label"><i></i> Ex${prog.ex} — ${prog.title.split(' ').slice(0,3).join(' ')}</span><button class="copy-mini" data-copy="program-${i}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M15 9 V7 a2 2 0 0 0-2-2 H5 a2 2 0 0 0-2 2 v8 a2 2 0 0 0 2 2 h2"/></svg> Copy program</button></div>
              <pre class="code-block">${escapeHtml(prog.program)}</pre>
            </div>
            <div class="hint"><svg width="16" height="16" viewBox="0 0 24 24" fill="#f59e0b"><path d="M12 2 L22 20 H2 Z" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.4"/><path d="M12 9 v6" stroke="#b45309" stroke-width="1.8" stroke-linecap="round"/><circle cx="12" cy="17" r="1.3" fill="#b45309"/></svg> Button ${i+1} = Ex ${prog.ex} • Hover keeps open • Click tab to switch views</div>
          </div>
          <div class="panel" data-panel="algorithm">
            <div class="algorithm"><ol>${prog.algo.map(s=>`<li>${escapeHtml(s)}</li>`).join('')}</ol></div>
            <div style="display:flex;justify-content:flex-end;margin-top:10px"><button class="copy-mini" data-copy="algo-${i}" style="background:#111;color:#fff;border-color:#111">⎙ Copy algorithm</button></div>
          </div>
          <div class="panel" data-panel="output">
            <div class="result-box">
              <div class="result-head"><b>Console Output / Result</b><button class="copy-mini" data-copy="output-${i}">Copy result</button></div>
              <pre class="result-pre">${escapeHtml(prog.output)}</pre>

    nav.appendChild(el);
  });

  nav.addEventListener('click',e=>{
    const chip=e.target.closest('.tab-chip');
    if(chip){
      const bar=chip.closest('.tab-bar');
      const tab=chip.dataset.tab;
      bar.querySelectorAll('.tab-chip').forEach(c=>c.classList.toggle('active',c===chip));
      const popup=bar.closest('.popup');
      popup.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active',p.dataset.panel===tab));
      e.stopPropagation();
    }
    const copyBtn=e.target.closest('[data-copy]');
    if(copyBtn){
      const id=copyBtn.dataset.copy;
      let text='';
      if(id.startsWith('program-')) text=programs[id.split('-')[1]].program;
      else if(id.startsWith('algo-')) text=programs[id.split('-')[1]].algo.map((s,idx)=>`${idx+1}. ${s}`).join('\n');
      else if(id.startsWith('output-')) text=programs[id.split('-')[1]].output;
      copyText(text);
      e.stopPropagation();
    }
    const copyAll=e.target.closest('[data-copy-all]');
    if(copyAll){
      copyText(programs[copyAll.dataset.copyAll].program);
      e.stopPropagation();
    }
    const copyCurrent=e.target.closest('[data-copy-current]');
    if(copyCurrent){
      const i=copyCurrent.dataset.copyCurrent;
      const popup=copyCurrent.closest('.popup');
      const active=popup.querySelector('.panel.active');
      let text='';
      if(active.dataset.panel==='program') text=programs[i].program;
      else if(active.dataset.panel==='algorithm') text=programs[i].algo.map((s,idx)=>`${idx+1}. ${s}`).join('\n');
      else text=programs[i].output;
      copyText(text);
      e.stopPropagation();
    }
  });

  // Mobile tap to toggle
  let openPopup=null;
  nav.querySelectorAll('.nav-item').forEach(item=>{
    item.addEventListener('click', (e)=>{
      if(window.innerWidth<=900){
        const pop=item.querySelector('.popup');
        const isOpen = pop.style.display==='block';
        if(openPopup && openPopup!==pop) openPopup.style.display='none';
        pop.style.display = isOpen ? 'none' : 'block';
        openPopup = isOpen ? null : pop;
        e.stopPropagation();
      }
    });
  });
  document.addEventListener('click', ()=>{
    if(openPopup && window.innerWidth<=900){ openPopup.style.display='none'; openPopup=null;}
  });
}
function escapeHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function copyText(t){navigator.clipboard.writeText(t).then(()=>showToast())}
function showToast(){const t=document.getElementById('toast');t.classList.add('show');clearTimeout(showToast._t);showToast._t=setTimeout(()=>t.classList.remove('show'),1800);}
createNav();
</script>
